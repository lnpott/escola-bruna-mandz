name: Daily Supabase Backup

on:
  schedule:
    # Roda todos os dias às 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:
    # Permite rodar manualmente pelo painel do GitHub Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    
    # Dá permissão para commitar as alterações de volta ao repositório
    permissions:
      contents: write

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: run backup script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node backup-api.js

      - name: commit and push backup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/backup_dados.json
          # Só commita se houver alterações
          if git diff --staged --quiet; then
            echo "Nenhuma alteração no backup hoje."
          else
            git commit -m "chore: backup automático do banco de dados (Supabase) [skip ci]"
            git push
          fi
