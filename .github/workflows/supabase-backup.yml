name: Daily Supabase Backup

on:
  schedule:
    # Roda todos os dias às 05:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:
    # Permite rodar manualmente pelo painel do GitHub Actions

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run backup script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node backup-api.js

      - name: Upload backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: backup_dados.json
          retention-days: 90
          if-no-files-found: error
