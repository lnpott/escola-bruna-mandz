<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/brand/LOGOPRETO.png" />
    <title>Painel de Administração</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap"
        rel="stylesheet" />
    <style>
        body {
            background: #09090b;
            color: #e4e4e7;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 24px;
            box-sizing: border-box;
        }

        .login-box {
            max-width: 360px;
            margin: 0 auto;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .login-box h2 {
            margin: 0 0 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 800;
        }

        .login-box p {
            color: #a1a1aa;
            font-size: 13px;
            margin: 0 0 24px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3f3f46;
            background: #09090b;
            color: #fff;
            margin-bottom: 16px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .login-box input:focus {
            outline: 2px solid #ef4444;
            border-color: #ef4444;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #ef4444;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .login-box button:hover {
            background: #dc2626;
        }

        .login-error {
            color: #f87171;
            font-size: 12px;
            margin-bottom: 16px;
            min-height: 16px;
        }

        /* Context Selector */
        .portal-screen {
            display: none;
            text-align: center;
        }

        .portal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
            border-bottom: 1px solid #27272a;
            padding-bottom: 16px;
        }

        .portal-header h1 {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 800;
        }

        .logout-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #dc2626;
            background: transparent;
            color: #f87171;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #1a0a0a;
        }

        .context-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .context-card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 48px 32px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .context-card:hover {
            border-color: #ef4444;
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(239, 68, 68, 0.1);
        }

        .context-icon {
            font-size: 56px;
            margin-bottom: 24px;
        }

        .context-card h2 {
            margin: 0 0 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 700;
        }

        .context-card p {
            margin: 0;
            color: #a1a1aa;
            font-size: 14px;
            line-height: 1.6;
        }

        @media (max-width: 640px) {
            .context-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .portal-header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- LOGIN SCREEN -->
        <div id="login-screen" class="login-box">
            <h2>Painel de Administração</h2>
            <p>Acesso restrito.</p>
            <input id="admin-password-input" type="password" placeholder="Senha" />
            <div id="login-error" class="login-error"></div>
            <button id="login-submit">Entrar</button>
        </div>

        <!-- PORTAL/SELECTOR SCREEN -->
        <div id="portal-screen" class="portal-screen">
            <div class="portal-header">
                <h1>Painel de Administração</h1>
                <button id="logout-btn" class="logout-btn">Sair</button>
            </div>
            <div class="context-grid">
                <a href="/app/" class="context-card">
                    <div class="context-icon">🎓</div>
                    <h2>Módulo Acadêmico</h2>
                    <p>Dashboard, Alunos, Professores, Matrículas, Agenda, Financeiro e Administração.</p>
                </a>
                <a href="commercial/index.html" class="context-card">
                    <div class="context-icon">🛍️</div>
                    <h2>Módulo Comercial</h2>
                    <p>Gestão de Pedidos, Produtos da Loja, Caixa, Custos, Investimentos e Faturamento.</p>
                </a>
            </div>
        </div>
    </div>

    <script>
        const loginScreen = document.getElementById('login-screen');
        const portalScreen = document.getElementById('portal-screen');
        const passwordInput = document.getElementById('admin-password-input');
        const loginSubmit = document.getElementById('login-submit');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');

        const STORAGE_KEY = 'admin_password';

        async function testPassword(password) {
            // Usamos a chamada de produtos ou pedidos para testar a senha admin
            const res = await fetch('/api/admin-financial?resource=dashboard', {
                headers: { 'x-admin-password': password }
            });
            if (!res.ok) {
                throw new Error('Senha incorreta.');
            }
            return true;
        }

        async function handleLogin() {
            const pass = passwordInput.value.trim();
            if (!pass) return;

            loginError.textContent = '';
            loginSubmit.disabled = true;
            loginSubmit.textContent = 'Verificando...';

            try {
                await testPassword(pass);
                sessionStorage.setItem(STORAGE_KEY, pass);
                showPortal();
            } catch (err) {
                loginError.textContent = err.message;
                passwordInput.value = '';
            } finally {
                loginSubmit.disabled = false;
                loginSubmit.textContent = 'Entrar';
            }
        }

        function showPortal() {
            loginScreen.style.display = 'none';
            portalScreen.style.display = 'block';
        }

        function showLogin() {
            loginScreen.style.display = 'block';
            portalScreen.style.display = 'none';
            sessionStorage.removeItem(STORAGE_KEY);
        }

        loginSubmit.addEventListener('click', handleLogin);
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        logoutBtn.addEventListener('click', showLogin);

        // Auto-login se já autenticado
        const saved = sessionStorage.getItem(STORAGE_KEY);
        if (saved) {
            showPortal();
        }
    </script>
</body>

</html>
